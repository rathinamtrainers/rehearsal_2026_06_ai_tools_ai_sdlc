name: CI

# Run on every PR, and on direct pushes to main.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Pytest (with coverage gate)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=100

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    # Only worth building the image once lint + tests are green.
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: learnflow-auth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker run -d --name lf_ci -p 8000:8000 learnflow-auth:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then echo " -> healthy"; ok=1; break; fi
            sleep 2
          done
          docker rm -f lf_ci
          test "${ok:-0}" = "1"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Gate: deploy runs only after lint, tests, AND the image build/smoke all pass...
    needs: [lint, test, docker-build]
    # ...and only on a push to main (never on PRs).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "All checks passed — deploying ${{ github.sha }}."
          echo "Replace this step with the real deploy (registry push, infra apply, etc.)."
